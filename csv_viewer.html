<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Visualizador de CSV</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  table { border-collapse: collapse; width: 100%; margin-top: 1em; }
  th, td { border: 1px solid #ccc; padding: 4px; text-align: left; }
  #filterInput { margin-top: 1em; }
</style>
</head>
<body>
<h1>Visualizar arquivo CSV</h1>
<input type="file" id="csvFileInput" accept=".csv" />
<br />
<label for="filterInput">Filtrar:</label>
<input type="text" id="filterInput" placeholder="Digite para filtrar" />
<table id="csvTable"></table>
<script>
function parseCSV(text) {
  const rows = text.trim().split(/\r?\n/).map(line => line.split(','));
  return rows;
}

function displayTable(rows) {
  const table = document.getElementById('csvTable');
  table.innerHTML = '';
  if (!rows.length) return;
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  rows[0].forEach(cell => {
    const th = document.createElement('th');
    th.textContent = cell;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.slice(1).forEach(row => {
    const tr = document.createElement('tr');
    row.forEach(cell => {
      const td = document.createElement('td');
      td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

document.getElementById('csvFileInput').addEventListener('change', function(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const rows = parseCSV(text);
    displayTable(rows);
  };
  reader.readAsText(file);
});

function applyFilter() {
  const filter = document.getElementById('filterInput').value.toLowerCase();
  const table = document.getElementById('csvTable');
  Array.from(table.getElementsByTagName('tbody')[0].rows).forEach(row => {
    const rowText = row.textContent.toLowerCase();
    row.style.display = rowText.includes(filter) ? '' : 'none';
  });
}

document.getElementById('filterInput').addEventListener('input', applyFilter);
</script>
</body>
</html>
